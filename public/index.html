<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baile de Primavera · Rei e Rainha</title>
  <meta name="description" content="Escolha o Rei e a Rainha do Baile de Primavera">
  <meta name="theme-color" content="#3a0509">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="img/titulo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="decor" aria-hidden="true">
    <img class="f f-tl" src="img/flor-grande.webp" alt="">
    <img class="f f-r" src="img/flor-media.webp" alt="">
    <img class="f f-l" src="img/folhas.webp" alt="">
    <img class="f f-bl" src="img/flor-pequena.webp" alt="">
    <img class="f f-br" src="img/galho.webp" alt="">
    <img class="p p1" src="img/petala-1.webp" alt="">
    <img class="p p2" src="img/petala-4.webp" alt="">
    <img class="p p3" src="img/petala-9.webp" alt="">
    <img class="p p4" src="img/petala-6.webp" alt="">
    <img class="p p5" src="img/petala-3.webp" alt="">
    <img class="p p6" src="img/petala-10.webp" alt="">
  </div>

  <div class="page">
    <header class="hero">
      <div class="rule crown-rule"><span></span><img src="img/coroa-pequena.webp" width="175" height="119" alt=""><span></span></div>
      <h1><img src="img/titulo.webp" width="887" height="330" alt="Baile de Primavera"></h1>
      <p class="tagline">Escolha o Rei e a Rainha<br>do nosso baile!</p>
    </header>

    <main id="app" aria-live="polite">
      <p class="loading">Carregando…</p>
    </main>

    <footer class="foot">
      <img src="img/divisor-flor.webp" width="616" height="70" alt="">
      <p>Baile de Primavera <span>•</span> 3º ano</p>
    </footer>
  </div>

  <template id="tpl-vote">
    <div class="cards">
      <article class="card" data-cat="king">
        <div class="rule"><span></span><img class="card-crown" src="img/coroa-rei.webp" width="281" height="176" alt=""><span></span></div>
        <h2>Rei</h2>
        <p class="class">Terceirão</p>
        <div class="avatar">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 22c-9.5 0-16 6.5-16 17.5C34 51 41 60 50 60s16-9 16-20.5C66 28.5 59.5 22 50 22z"/>
            <path d="M41.5 55h17l2 15h-21z"/>
            <path d="M8 106c1-21 14-33 33-36h18c19 3 32 15 33 36z"/>
          </svg>
        </div>
        <p class="chosen" data-chosen></p>
        <button type="button" class="pill" data-open="king">Selecionar</button>
      </article>

      <article class="card" data-cat="queen">
        <div class="rule"><span></span><img class="card-crown" src="img/tiara.webp" width="242" height="131" alt=""><span></span></div>
        <h2>Rainha</h2>
        <p class="class">Terceirão</p>
        <div class="avatar">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M12 106c1-20 14-30 30-32h16c16 2 29 12 30 32z"/>
            <path d="M50 24c-12 0-18 8-18 20 0 12-2 22-6.5 32 4.5 3 10 3 14.5 0h20c4.5 3 10 3 14.5 0-4.5-10-6.5-20-6.5-32 0-12-6-20-18-20z"/>
          </svg>
          <img class="mini-tiara" src="img/tiara.webp" width="242" height="131" alt="">
        </div>
        <p class="chosen" data-chosen></p>
        <button type="button" class="pill" data-open="queen">Selecionar</button>
      </article>
    </div>

    <label class="code" hidden>
      <span>Código de votação</span>
      <input name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="EX: K7P2QX">
    </label>

    <button type="button" class="cta" data-action="review">
      Votar agora
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
    </button>
    <p class="hint" role="status">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></svg>
      <span data-hint>Vote apenas uma vez!</span>
    </p>
  </template>

  <dialog id="picker" class="sheet" aria-labelledby="picker-title">
    <button type="button" class="close" data-action="close" aria-label="Fechar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="rule"><span></span><img class="sheet-crown" src="img/coroa-rei.webp" width="281" height="176" alt=""><span></span></div>
    <h3 id="picker-title"></h3>
    <p class="class">Terceirão</p>
    <ul class="options" role="listbox"></ul>
  </dialog>

  <dialog id="confirm" class="sheet" aria-labelledby="confirm-title">
    <div class="rule"><span></span><img class="sheet-crown" src="img/coroa-pequena.webp" width="175" height="119" alt=""><span></span></div>
    <h3 id="confirm-title">Confirmar voto</h3>
    <dl class="summary">
      <div><dt>Rei</dt><dd data-confirm="king"></dd></div>
      <div><dt>Rainha</dt><dd data-confirm="queen"></dd></div>
    </dl>
    <p class="fine">Depois de confirmar não é possível alterar.</p>
    <p class="error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="pill" data-action="cancel">Voltar</button>
      <button type="button" class="cta small" data-action="send">Confirmar</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
