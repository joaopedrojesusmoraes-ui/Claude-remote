# Deploy com 1 clique no Render (render.com → New → Blueprint → escolha este repositório).
services:
  - type: web
    name: baile-de-primavera
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # o Render vai pedir para você digitar a senha do painel
      - key: IP_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: baile-db
          property: connectionString

databases:
  - name: baile-db
    plan: free
